server.port=8081

# This service owns its own schema/user - a separate Oracle login from
# employee-service's "employee_app". Each microservice owns its own data.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=auth_app
spring.datasource.password=auth_app
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# validate = checks the table matches AppUser.java, changes nothing (run schema.sql first)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required if your Oracle is 11g (e.g. Oracle 11g XE) - without this,
# Hibernate generates "FETCH FIRST ... ROWS ONLY" (Oracle 12c+ only syntax)
# and any query with a limit, including existsByEmail()/findByEmail(),
# fails with ORA-00933. On Oracle 12c or newer, delete this line and let
# Hibernate auto-detect the dialect instead - it performs better there.
# Hibernate 7 consolidated the old per-version Oracle dialects (Oracle9i,
# Oracle10g, etc.) into this one class - it still generates ROWNUM-based
# pagination compatible with 11g.
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect

# --- JWT settings ---
# IMPORTANT: this secret must be IDENTICAL to the one in employee-service's
# application.properties. Both services use the same symmetric key: auth-service
# signs tokens with it, employee-service verifies signatures with it - no network
# call between the two services is needed to check a token.
# DEMO VALUE ONLY - load from an environment variable in any real deployment:
#   app.jwt.secret=${JWT_SECRET}
app.jwt.secret=ChangeThisToARandom256BitSecretKeySharedByBothServices
app.jwt.expiration-ms=3600000
