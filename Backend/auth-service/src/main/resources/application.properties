server.port=8081

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=admin
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Clean development DDL auto-generation (persists registered users across restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# --- Strongly Typed JWT Settings ---
jwt.secret=ChangeThisToARandom256BitSecretKeySharedByBothServices
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
jwt.issuer=infoseva-auth-service

# Legacy compatibility properties
app.jwt.secret=${jwt.secret}
app.jwt.expiration-ms=${jwt.access-token-expiration}
app.jwt.refresh-expiration-ms=${jwt.refresh-token-expiration}

# --- Google OAuth2 Configuration ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

# --- Real Email SMTP Configuration (Environment-Variable Backed) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.protocol=smtps
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.ssl.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtps.connectiontimeout=8000
spring.mail.properties.mail.smtps.timeout=8000
spring.mail.properties.mail.smtps.writetimeout=8000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


# --- 2Factor SMS OTP ---
twofactor.api-key=${TWOF_FACTOR_API_KEY:}
